[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dace-relayout"
version = "0.1.2"
description = "Layout transformation sequences on SDFGs: GPU linear layouts and distributed (MPI, NCCL/RCCL) data movement"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
# relayout.ops (the op schema and its lowering) imports nothing past the standard library; the SDFG passes
# and kernels need DaCe extended, published as dace-extended (import dace). hpcagent-bench depends on relayout, so
# relayout never depends on it.
dependencies = [
    "dace-extended>=1.0.0",
    "numpy>=2.3.2",
    "pydantic>=2",
    "islpy",
    "z3-solver",
]

[project.urls]
Repository = "https://github.com/ThrudPrimrose/dace-relayout"
Changelog = "https://github.com/ThrudPrimrose/dace-relayout/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mpi = ["mpi4py"]

# Checkout-only: dace-fortran is not on PyPI, so naming it in the published metadata (an extra) would let whoever
# registers the name there run code on `pip install dace-relayout[...]`. Groups are never published.
[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff", "pre-commit", "ml-dtypes"]
# The Fortran kernels: dace-fortran builds its nanobind bridge on first use but lists nanobind only in its
# testing group.
fortran = ["dace-fortran", "nanobind"]
# SDFG casts (apply_requests): FP-Arena's floating-point type transformation.
fparena = ["fp-arena>=0.1.0"]

[tool.uv.sources]
# dace-extended and FP-Arena resolve from PyPI, the releases pip installs; dace-fortran has no release.
dace-fortran = { git = "https://github.com/spcl/dace-fortran.git", branch = "main" }

[tool.uv]
# dace-fortran names plain `dace`, which would install upstream DaCe into the same dace/ folder as dace-extended:
# never install it.
override-dependencies = ["dace ; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/relayout"]
# src/relayout/corpus is a symlink to the top-level corpus/. A wheel built from the sdist skips it and one built from a
# checkout follows it, so exclude it and ship corpus/ once, as relayout.corpus (force-include ignores the exclude).
exclude = ["/src/relayout/corpus"]
[tool.hatch.build.targets.wheel.force-include]
"corpus" = "relayout/corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--maxfail=10 -ra"
timeout = 1800
markers = [
    "mpi: needs mpirun -n >= 2",
    "fortran: needs an LLVM flang (dace_fortran.llvm_toolchain.find_flang)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Copied verbatim from dace@extended tests/transformations/layout/kernels.
"corpus/k*.py" = ["E731"]
# An explicit dace tasklet binds its connectors (a << A[...]) by name, which pyflakes cannot see.
"tests/test_sdfg_canonicalize_schedule.py" = ["F821", "F841"]
